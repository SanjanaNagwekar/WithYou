name: Bug report
description: Report a reproducible problem in WithYou
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private recordings, or personal data. Report security issues through the private advisory link.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the app...
        2. Open...
        3. Select...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: Commit SHA or branch name
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Chrome 140, Node 24
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, provider responses, recordings, and personal information first.

